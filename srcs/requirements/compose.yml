services:
  mariadb:
    container_name: mariadb
    image: mariadb
    env_file: ../.env
    build: ./mariadb
    restart: always
    secrets:
      - db_root_password
      - db_admin_password
      - db_password
    volumes: [mariadb_data:/var/lib/mysql]
    networks:
      - inception

secrets:
  db_root_password:
    file: ../../secrets/db_root_password
  db_admin_password:
    file: ../../secrets/db_admin_password
  db_password:
    file: ../../secrets/db_password
  

networks:
  inception:
    driver: bridge


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dbotelho/data/mariadb
