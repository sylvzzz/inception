services:
  mariadb:
    container_name: mariadb
    image: mariadb
    env_file: .env
    build: ./requirementes/mariadb
    restart: always
    secrets:
      - db_root_password
      - db_admin_password
      - db_password
    volumes: [mariadb_data:/var/lib/mysql]
    networks:
      - inception

  wordpress:
    container_name: wordpress
    image: wordpress
    build: ./requirementes/wordpress
    restart: always
    env_file: .env
    secrets:
      - db_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    depends_on:
      - mariadb

  nginx:
    container_name: nginx
    image: nginx
    build: ./requirementes/nginx
    restart: always
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html:ro
    networks:
      - inception
    depends_on:
      - wordpress
  

secrets:
  db_root_password:
    file: ../secrets/db_root_password
  db_admin_password:
    file: ../secrets/db_admin_password
  db_password:
    file: ../secrets/db_password
  

networks:
  inception:
    driver: bridge


volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dbotelho/data/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/dbotelho/data/wordpress
